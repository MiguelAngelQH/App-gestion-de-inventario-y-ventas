apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-ventas-web
  namespace: "2023205111"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-ventas-web
  template:
    metadata:
      labels:
        app: smart-ventas-web
    spec:
      hostNetwork: true
      dnsPolicy: Default
      containers:
      - name: web
        image: zaynok/smart-ventas-web:v15
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: smart-ventas-web-svc
  namespace: "2023205111"
spec:
  type: NodePort
  selector:
    app: smart-ventas-web
  ports:
  - port: 3000
    targetPort: 3000
