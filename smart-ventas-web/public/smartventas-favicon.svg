<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Icono favicon SmartVentas</title>
<desc>Versión cuadrada del icono, un hexágono escudo con dos flechas curvas en bucle infinito, teal arriba y azul abajo, para uso como favicon.</desc>
<defs>
<linearGradient id="hexStroke2" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#00897B"/>
<stop offset="100%" stop-color="#1565C0"/>
</linearGradient>
<linearGradient id="hexFill2" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#FFFFFF"/>
<stop offset="100%" stop-color="#F0FAF8"/>
</linearGradient>
</defs>

<polygon points="200,40 338.7,120 338.7,280 200,360 61.3,280 61.3,120" fill="url(#hexFill2)" stroke="url(#hexStroke2)" stroke-width="8"/>

<path d="M 120,168 C 155,110 245,110 280,168" fill="none" stroke="#00897B" stroke-width="15" stroke-linecap="round"/>
<polygon points="280,168 262,152 268,178" fill="#00897B"/>

<path d="M 280,232 C 245,290 155,290 120,232" fill="none" stroke="#1565C0" stroke-width="15" stroke-linecap="round"/>
<polygon points="120,232 138,248 132,222" fill="#1565C0"/>
</svg>
